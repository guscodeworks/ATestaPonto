<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATesta Ponto | Nova senha</title>
  <link rel="stylesheet" href="/assets/css/senha/senha.css?v=20260818-simple-password">
</head>
<body>
  <div class="phone-frame">
    <main class="content">
      <div class="logo-desktop" aria-hidden="true">
        <img src="/assets/img/atestaponto-favicon-96.webp" alt="">
      </div>

      <h1 class="brand"><span class="brand-a">ATesta</span> <span class="brand-p">Ponto</span></h1>

      <section class="step" id="step-senha" data-step="active" aria-labelledby="password-title">
        <h2 class="title" id="password-title">Crie uma nova senha</h2>
        <p class="subtitle">Use pelo menos 8 caracteres.</p>

        <form id="form-senha" novalidate>
          <label class="sr-only" for="nova-senha">Nova senha</label>
          <div class="input-group">
            <span class="input-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="1.5" stroke="#111" stroke-width="1.6"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="#111" stroke-width="1.6"/></svg>
            </span>
            <input type="password" id="nova-senha" name="nova-senha" placeholder="Nova senha" autocomplete="new-password" required>
            <button type="button" class="toggle-visibility" data-target="nova-senha" aria-label="Mostrar senha">Mostrar</button>
          </div>

          <label class="sr-only" for="confirma-senha">Confirmar nova senha</label>
          <div class="input-group" id="confirma-senha-group">
            <span class="input-icon" aria-hidden="true">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="9" rx="1.5" stroke="#111" stroke-width="1.6"/><path d="M8 11V8a4 4 0 0 1 8 0v3" stroke="#111" stroke-width="1.6"/></svg>
            </span>
            <input type="password" id="confirma-senha" name="confirma-senha" placeholder="Confirmar nova senha" autocomplete="new-password" required>
            <button type="button" class="toggle-visibility" data-target="confirma-senha" aria-label="Mostrar senha">Mostrar</button>
          </div>
          <p class="field-error" id="senha-error" role="alert"></p>

          <button type="submit" class="btn-primary" id="btn-salvar">
            <span class="btn-label">Salvar senha</span>
            <span class="btn-spinner" aria-hidden="true"></span>
          </button>
        </form>
      </section>

      <section class="step step--success" id="step-sucesso" data-step="inactive" aria-live="polite">
        <h2 class="title">Senha atualizada</h2>
        <p class="subtitle">Entre novamente com sua nova senha.</p>
        <a href="/login" class="btn-primary btn-primary--link">Ir para o login</a>
      </section>
    </main>
  </div>

  <script src="/assets/js/senha.js?v=20260818-simple-password"></script>
</body>
</html>
