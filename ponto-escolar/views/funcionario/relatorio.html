<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Histórico de ponto</title>
  <link rel="icon" href="/assets/img/favicon.svg"/>
  <link rel="stylesheet" href="/assets/css/tokens.css"/>
  <link rel="stylesheet" href="/assets/css/funcionario/base.css?v=20260804-mobile-legibility"/>
  <link rel="stylesheet" href="/assets/css/funcionario/relatorio.css?v=20260804-history-api"/>
  <script src="/assets/js/funcionario/relatorio.js?v=20260804-history-api" defer></script>
</head>
<body class="employee-area employee-report">

<div class="employee-shell">
  <header class="employee-header">
    <a class="employee-identity" href="/funcionario/perfil" aria-label="Abrir perfil">
      <span class="employee-avatar" id="header-avatar" aria-hidden="true">—</span>
      <span class="employee-identity-copy">
        <strong class="employee-name" id="header-name">Carregando...</strong>
        <span class="employee-role" id="header-cargo">Carregando...</span>
      </span>
    </a>
    <span class="employee-brand-frame" aria-hidden="true">
      <img class="employee-brand-mark" src="/assets/img/atestaponto-symbol.png" alt="" width="42" height="42"/>
    </span>
  </header>

  <main class="employee-main report-main" id="report-content" aria-busy="true">
    <header class="report-page-heading">
      <h1>Histórico</h1>
    </header>

    <label class="report-month-field" for="report-month">
      <span>Mês</span>
      <input id="report-month" name="mes" type="month" autocomplete="off"/>
    </label>

    <section class="employee-card report-summary" aria-labelledby="summary-title">
      <h2 class="report-summary-title" id="summary-title">Resumo</h2>
      <dl class="report-summary-grid">
        <div>
          <dt>Dias registrados</dt>
          <dd id="summary-records">—</dd>
        </div>
        <div>
          <dt>Total trabalhado</dt>
          <dd id="summary-worked">—</dd>
        </div>
      </dl>
    </section>

    <section class="report-history" aria-labelledby="history-title">
      <header class="report-history-header">
        <h2 id="history-title">Registros</h2>
      </header>

      <div class="report-state report-state-loading" id="report-loading" role="status" aria-live="polite">
        <span class="report-state-spinner" aria-hidden="true"></span>
        <strong>Carregando histórico</strong>
      </div>

      <div class="report-state" id="report-empty" hidden>
        <img src="/assets/icons/clipboard-list.svg" alt="" aria-hidden="true" width="28" height="28"/>
        <strong>Nenhum registro neste mês</strong>
      </div>

      <div class="report-state report-state-error" id="report-error" role="alert" hidden>
        <img src="/assets/icons/circle-x.svg" alt="" aria-hidden="true" width="28" height="28"/>
        <strong>Não foi possível carregar</strong>
        <button class="report-retry" id="report-retry" type="button">Tentar novamente</button>
      </div>

      <div class="report-day-list" id="report-day-list" aria-live="polite" hidden></div>
    </section>
  </main>
</div>

<nav class="employee-bottom-nav" aria-label="Navegação do funcionário">
  <div class="employee-bottom-nav-inner">
    <a href="/funcionario" class="employee-bottom-nav-link">
      <span class="employee-bottom-nav-icon"><img src="/assets/icons/layout-dashboard.svg" alt="" aria-hidden="true"/></span>
      <span>Início</span>
    </a>
    <a href="/funcionario/relatorio" class="employee-bottom-nav-link active" aria-current="page">
      <span class="employee-bottom-nav-icon"><img src="/assets/icons/chart-column.svg" alt="" aria-hidden="true"/></span>
      <span>Histórico</span>
    </a>
    <a href="/funcionario/perfil" class="employee-bottom-nav-link">
      <span class="employee-bottom-nav-icon"><img src="/assets/icons/user.svg" alt="" aria-hidden="true"/></span>
      <span>Perfil</span>
    </a>
  </div>
</nav>

</body>
</html>
