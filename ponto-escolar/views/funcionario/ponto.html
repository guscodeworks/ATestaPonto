<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Meu ponto — ATestaPonto</title>
  <link rel="icon" href="/assets/img/favicon.svg"/>
  <link rel="stylesheet" href="/assets/css/tokens.css"/>
  <link rel="stylesheet" href="/assets/css/loading.css?v=20260729-loading-states"/>
  <link rel="stylesheet" href="/assets/css/funcionario/base.css?v=20260803-employee-base"/>
  <link rel="stylesheet" href="/assets/css/funcionario/ponto.css?v=20260803-dashboard-redesign"/>
  <script src="/assets/js/loading.js?v=20260729-loading-states" defer></script>
  <script src="/assets/js/funcionario/ponto.js?v=20260803-dashboard-redesign" defer></script>
</head>
<body class="employee-area employee-dashboard">

<div class="employee-shell">
  <header class="employee-header">
    <a class="employee-identity" href="/funcionario/perfil" aria-label="Abrir perfil">
      <span class="employee-avatar" id="tp-avatar" aria-hidden="true">—</span>
      <span class="employee-identity-copy">
        <strong class="employee-name" id="hero-name">—</strong>
        <span class="employee-role" id="hero-cargo">—</span>
      </span>
    </a>
    <span class="employee-brand-frame" aria-hidden="true">
      <img class="employee-brand-mark" src="/assets/img/atestaponto-symbol.png" alt="" width="42" height="42"/>
    </span>
  </header>

  <main class="employee-main">
    <section class="ponto-overview" aria-labelledby="dashboard-title">
      <h1 class="ponto-sr-title" id="dashboard-title">Registro de ponto</h1>

      <div class="ponto-now" aria-label="Data e horário atuais">
        <p class="ponto-current-date">
          <span id="hero-weekday">--</span>,
          <span id="hero-date">-- de -- de ----</span>
        </p>
        <time class="ponto-time" id="hero-clock">--:--</time>
      </div>

      <div class="ponto-next" aria-live="polite">
        <h2>Próximo registro</h2>
        <p class="ponto-next-message" id="status-text">
          <span id="next-label">Carregando jornada</span>
          <strong id="next-time"></strong>
        </p>
      </div>

      <section class="employee-card journey-card" aria-labelledby="journey-title" aria-busy="true">
        <div class="journey-card-accent journey-card-accent-blue" aria-hidden="true"></div>
        <div class="journey-card-accent journey-card-accent-red" aria-hidden="true"></div>
        <h2 class="journey-title" id="journey-title">Jornada de hoje</h2>
        <ol class="journey-steps" id="timeline" aria-live="polite"></ol>
        <p class="journey-summary" id="last-action">Carregando registros...</p>
      </section>

      <div class="ponto-action-area">
        <button class="ponto-action is-loading" id="btn-ponto" type="button" data-state="LOADING" onclick="baterPonto()" aria-label="Carregando estado do ponto" disabled>
          <span class="ponto-action-copy">
            <span class="ponto-action-visual" aria-hidden="true">
              <img class="ponto-action-icon" id="btn-icon" src="/assets/icons/clock.svg" alt="" width="22" height="22"/>
              <span class="ponto-action-spinner"></span>
            </span>
            <span class="ponto-btn-label" id="btn-label">Carregando</span>
          </span>
        </button>
        <span class="ponto-action-announcer" id="ponto-action-announcer" aria-live="polite" aria-atomic="true"></span>
      </div>
    </section>
  </main>
</div>

<nav class="employee-bottom-nav" aria-label="Navegação do funcionário">
  <div class="employee-bottom-nav-inner">
    <a href="/funcionario" class="employee-bottom-nav-link active" aria-current="page">
      <span class="employee-bottom-nav-icon"><img src="/assets/icons/layout-dashboard.svg" alt="" aria-hidden="true"/></span>
      <span>Início</span>
    </a>
    <a href="/funcionario/relatorio" class="employee-bottom-nav-link">
      <span class="employee-bottom-nav-icon"><img src="/assets/icons/chart-column.svg" alt="" aria-hidden="true"/></span>
      <span>Histórico</span>
    </a>
    <a href="/funcionario/perfil" class="employee-bottom-nav-link">
      <span class="employee-bottom-nav-icon"><img src="/assets/icons/user.svg" alt="" aria-hidden="true"/></span>
      <span>Perfil</span>
    </a>
  </div>
</nav>

<dialog class="employee-modal ponto-confirm" id="confirm-modal" aria-labelledby="confirm-title" aria-describedby="confirm-sub">
  <div class="employee-modal-card ponto-confirm-card">
    <div class="confirm-icon-wrap" aria-hidden="true">
      <img id="confirm-icon" src="/assets/icons/clock.svg" alt="" width="24" height="24"/>
    </div>
    <h2 class="confirm-title" id="confirm-title">Confirmar registro</h2>
    <time class="confirm-time" id="confirm-time"></time>
    <p class="confirm-sub" id="confirm-sub">Confirme antes de registrar o ponto.</p>
    <div class="confirm-actions" id="confirm-actions">
      <button class="employee-button confirm-cancel" id="confirm-cancel" type="button" onclick="fecharConfirm()">
        Cancelar
      </button>
      <button class="employee-button employee-button-primary confirm-submit" id="confirm-submit" type="button" onclick="confirmarRegistroPonto()">
        Confirmar
      </button>
    </div>
  </div>
</dialog>

<div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="true"></div>

</body>
</html>
