<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATesta Ponto | Página não encontrada</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32x32.png" />
<link rel="stylesheet" href="/assets/css/error/error.css">
  <script src="/assets/js/error/error.js" defer></script>
</head>
<body>

  <div class="phone-frame" id="card">

    <div class="logo-desktop" aria-hidden="true">
      <img src="/assets/img/atestaponto-favicon-96.webp" alt="ATesta Ponto">
    </div>

    <main class="content">

      <h1 class="brand"><span class="brand-a">ATesta</span> <span class="brand-p">Ponto</span></h1>

      <section class="error-block" aria-labelledby="error-heading">

        <p class="error-code" aria-hidden="true">
          <span class="digit digit--dark">4</span><span class="digit digit--blue">0</span><span class="digit digit--red">4</span>
        </p>

        <h2 id="error-heading" class="title">Página não encontrada</h2>

        <p class="subtitle">
          O endereço que você tentou acessar não existe, foi movido ou está temporariamente indisponível.
          Verifique o link digitado ou volte para o início.
        </p>

        <button type="button" class="btn-primary" id="btn-voltar">
          <span class="btn-label">Voltar ao início</span>
        </button>

      </section>

    </main>
  </div>
</body>
</html>
