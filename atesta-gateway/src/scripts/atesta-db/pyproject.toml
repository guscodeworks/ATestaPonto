[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atesta-db"
version = "1.0.0"
description = "CLI independente para inicializar o banco de dados do ATestaPonto com o baseline canônico"
requires-python = ">=3.11"
dependencies = [
    "PyMySQL>=1.1",
]

[project.scripts]
atesta-db = "atesta_db.cli:main"

[tool.setuptools]
packages = ["atesta_db"]
