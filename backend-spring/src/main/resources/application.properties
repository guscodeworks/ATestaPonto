spring.application.name=backend-spring
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration,org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
server.port=8081
# Resolve IP/protocolo no container apenas para proxies confiaveis, antes das cotas de abuso.
server.forward-headers-strategy=native

# Credenciais vêm exclusivamente do ambiente; não há criação automática do banco.
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.type=com.zaxxer.hikari.HikariDataSource
spring.datasource.hikari.read-only=true
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.data-source-properties.readOnlyPropagatesToServer=true
spring.datasource.hikari.data-source-properties.connectTimeout=3000
spring.datasource.hikari.data-source-properties.socketTimeout=5000

# Consultas usam read-only; somente a transacao de criacao de escola habilita escrita.
# Nenhum inicializador SQL ou migration.
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
spring.liquibase.enabled=false

# Integração somente GET, sem retry na aplicação.
integrations.brasilapi.base-url=${BRASILAPI_BASE_URL:https://brasilapi.com.br}
integrations.brasilapi.connect-timeout=${BRASILAPI_CONNECT_TIMEOUT:3s}
integrations.brasilapi.read-timeout=${BRASILAPI_READ_TIMEOUT:8s}

# Mesma chave privada do Node; recebida pelo ambiente, sem valor padrão.
# Obrigatória para iniciar. Nunca há modo interno sem autenticação.
# Configuração por ambiente e carregamento de .env: backend-spring/README.md.
internal.auth.shared-key=${INTERNAL_API_SHARED_KEY}
internal.auth.max-clock-skew-seconds=60

# Cliente OAuth publico independente do Node. HTTP somente com opt-in local.
admin.govbr.authorize-url=${GOVBR_AUTHORIZE_URL}
admin.govbr.token-url=${GOVBR_TOKEN_URL}
admin.govbr.userinfo-url=${GOVBR_USERINFO_URL}
admin.govbr.client-id=${GOVBR_CLIENT_ID}
admin.govbr.client-secret=${GOVBR_CLIENT_SECRET}
admin.govbr.redirect-uri=${GOVBR_REDIRECT_URI}
admin.govbr.logout-url=${GOVBR_LOGOUT_URL:/}
admin.session.secure=${ADMIN_SESSION_SECURE:true}
admin.session.ttl-seconds=${ADMIN_SESSION_TTL_SECONDS:7200}
# Spring Session usa Redis sempre, independentemente do fallback local dos cookies de ponto.
admin.session.redis.namespace=${REDIS_NAMESPACE:atestaponto:production}:admin:spring-session
spring.data.redis.client-type=jedis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_TLS:false}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s
spring.data.redis.repositories.enabled=false
server.servlet.session.timeout=${ADMIN_SESSION_TTL_SECONDS:7200}s
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.name=ATESTA_ADMIN_SESSION
server.servlet.session.cookie.path=/
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${admin.session.secure}
server.servlet.session.cookie.max-age=${ADMIN_SESSION_TTL_SECONDS:7200}s
server.error.include-message=never
server.error.include-stacktrace=never
