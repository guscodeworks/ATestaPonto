name: atestaponto-spring-standalone

services:
  spring:
    build:
      context: ..
      dockerfile: Dockerfile
    image: atestaponto-spring-standalone:local
    ports:
      - "127.0.0.1:${SPRING_HTTP_PORT:-18081}:8081"
    environment:
      SERVER_PORT: "8081"
      # Acesso local direto; forwarded headers exigem proxy explicitamente confiavel.
      SERVER_FORWARD_HEADERS_STRATEGY: ${SERVER_FORWARD_HEADERS_STRATEGY:-none}
      SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES: ${SERVER_TOMCAT_REMOTEIP_INTERNAL_PROXIES:-}
      SERVER_TOMCAT_REMOTEIP_TRUSTED_PROXIES: ${SERVER_TOMCAT_REMOTEIP_TRUSTED_PROXIES:-}
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?Configure DB_NAME no arquivo local}
      DB_USER: ${DB_USER:?Configure DB_USER sem usar root}
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no arquivo local}
      INTERNAL_API_SHARED_KEY: ${INTERNAL_API_SHARED_KEY:?Configure a chave HMAC local}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET local}
      SESSION_SECRET: ${SESSION_SECRET:?Configure SESSION_SECRET local}
      NODE_ENV: ${NODE_ENV:-production}
      REDIS_ENABLED: "true"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # O cliente QR/rate limit atual nao suporta senha/TLS; Redis fica na rede interna.
      REDIS_TLS: "false"
      REDIS_NAMESPACE: atestaponto:standalone
      ADMIN_SESSION_SECURE: ${ADMIN_SESSION_SECURE:-true}
      ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-7200}
      CORS_ORIGIN: ${CORS_ORIGIN:?Configure a origem publica exata}
      APP_BASE_URL: ${APP_BASE_URL:?Configure a URL publica}
      GOVBR_AUTHORIZE_URL: ${GOVBR_AUTHORIZE_URL:?Configure o provedor OAuth autorizado}
      GOVBR_TOKEN_URL: ${GOVBR_TOKEN_URL:?Configure o provedor OAuth autorizado}
      GOVBR_USERINFO_URL: ${GOVBR_USERINFO_URL:?Configure o provedor OAuth autorizado}
      GOVBR_CLIENT_ID: ${GOVBR_CLIENT_ID:?Configure o cliente OAuth}
      GOVBR_CLIENT_SECRET: ${GOVBR_CLIENT_SECRET:?Configure o segredo OAuth local}
      GOVBR_REDIRECT_URI: ${GOVBR_REDIRECT_URI:?Configure o callback OAuth}
      GOVBR_LOGOUT_URL: ${GOVBR_LOGOUT_URL:-/}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - data
      - outbound
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  mysql:
    image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    environment:
      MYSQL_DATABASE: ${DB_NAME:?Configure DB_NAME no arquivo local}
      MYSQL_USER: ${DB_USER:?Configure DB_USER sem usar root}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD no arquivo local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure a senha root local separada}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u \"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" --batch --skip-column-names -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12

  init-schema:
    profiles: ["schema"]
    image: mysql:8.4@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    entrypoint: ["/bin/sh", "/init-schema.sh"]
    restart: "no"
    environment:
      DB_NAME: ${DB_NAME:?Configure DB_NAME no arquivo local}
      DB_USER: ${DB_USER:?Configure DB_USER sem usar root}
      MYSQL_PWD: ${DB_PASSWORD:?Configure DB_PASSWORD no arquivo local}
    volumes:
      - type: bind
        source: ./init-schema.sh
        target: /init-schema.sh
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../atesta-gateway/database/schema/ponto.sql
        target: /schema/ponto.sql
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  data:
    internal: true
  outbound: {}

volumes:
  mysql-data: {}
  redis-data: {}
