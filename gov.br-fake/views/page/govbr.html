<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Autenticação administrativa | AtestaPonto ID</title>
  <link rel="stylesheet" href="/assets/css/saladofuturo/govbr.css">
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="page-title">
      <div class="card-heading">
        <p class="brand-name">AtestaPonto ID</p>
        <span class="environment-badge">Ambiente demonstrativo</span>
      </div>

      <h1 id="page-title">Autenticação administrativa</h1>
      <p class="subtitle">Entre com as credenciais de teste para continuar.</p>

      <form class="login-form" id="demoLoginForm">

        <div class="field-group">
          <label for="login">Login</label>
          <input
            id="login"
            name="login"
            type="text"
            autocomplete="username"
            maxlength="64"
            required
          >
        </div>

        <div class="field-group">
          <label for="password">Senha</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            maxlength="256"
            required
          >
        </div>

        <p class="status-message" id="loginStatus" role="alert" aria-live="polite" hidden></p>

        <button class="login-button" id="loginButton" type="submit">
          Entrar como administrador
        </button>
      </form>

      <p class="form-note">Use somente credenciais fornecidas para testes.</p>
    </section>
  </main>

  <script src="/assets/js/saladofuturo/govbr.js"></script>
</body>
</html>
