<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <title>Dashboard demonstrativo | ATestaPonto</title>
  <link rel="stylesheet" href="/assets/css/saladofuturo/visual.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-content">
      <div class="brand-lockup">
        <span class="brand-mark" aria-hidden="true"></span>
        <div>
          <p class="brand-name">ATestaPonto</p>
          <p class="brand-subtitle">Simulador de identidade</p>
        </div>
      </div>

      <div class="topbar-actions">
        <span class="environment-badge">Ambiente demonstrativo</span>
        <a class="logout-link" href="/auth/logout">Sair</a>
      </div>
    </div>
  </header>

  <main class="dashboard-shell">
    <section class="welcome" aria-labelledby="page-title">
      <h1 id="page-title">Olá, Administrador</h1>
      <p>Sua identidade demonstrativa foi autenticada.</p>
      <div class="auth-status">
        <span class="status-dot" aria-hidden="true"></span>
        Autenticação concluída
      </div>
    </section>

    <section class="action-card" aria-labelledby="action-title">
      <div>
        <h2 id="action-title">Gerenciar Pontos</h2>
        <p>Acesse o painel administrativo do ATestaPonto.</p>
      </div>
      <a class="primary-action" href="/auth/continue">Gerenciar Pontos</a>
    </section>
  </main>

</body>
</html>
